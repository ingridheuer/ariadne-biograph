[project]
name = "ariadne-biograph"
version = "0.0.1"
description = "GraphRAG over PrimeKG: GNN-based gene–disease prediction and explainable drug repurposing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ingrid Heuer" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ariadne_biograph"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "NPY",      # numpy-specific rules
    "RUF",      # ruff-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
